name: Release

on:
  push:
    tags: [ "v[0-9]+" ]

concurrency:
  group: ${{ github.workflow_ref }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ macos-26, ubuntu-26.04 ]

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install ShellCheck
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Install ShellCheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Run tests
        run: make test

  release:
    name: Release
    needs: checks
    runs-on: ubuntu-26.04

    permissions:
      contents: write

    steps:
      - name: Create release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
