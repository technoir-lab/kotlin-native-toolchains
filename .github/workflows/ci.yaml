name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
    types: [ checks_requested ]

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ macos-26, ubuntu-26.04 ]

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install ShellCheck
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Install ShellCheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Run tests
        run: make test

  actionlint:
    name: Lint GitHub Actions
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1.73.2
        with:
          level: warning
          fail_level: warning
