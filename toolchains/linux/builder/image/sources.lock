# Source archives pinned for the Linux builder image.
#
# Each line declares one source with five whitespace-separated fields:
#
#   name      Lowercase words joined by hyphens. The archive is extracted to
#             sources/<name>/ while the builder image is prepared, its
#             licenses ship in share/licenses/<name>/ of every target, and
#             its version is recorded as <name>.version, with hyphens
#             written as dots, in builder.properties and manifest.properties.
#   version   The upstream version. {version} in the URL stands for it.
#   licenses  Comma-separated files or glob patterns, relative to the root of
#             the extracted archive, that must ship with every toolchain.
#   url       The HTTPS download URL.
#   sha512    The SHA-512 digest of the downloaded archive.
#
# The image build, the container build, the host-side artifact checks, and the
# build metadata all read this file. To update a source, change its version
# and digest together.

